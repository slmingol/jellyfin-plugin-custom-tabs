name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Rebase main onto upstream/main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/IAmParadox27/jellyfin-plugin-custom-tabs.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Rebase onto upstream/main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rebase upstream/main

      - name: Push
        run: git push origin main --force-with-lease

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Sync upstream failed: rebase conflict';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['sync-failure'],
            });
            if (!issues.data.find(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Weekly upstream sync failed on run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nResolve manually:\n\n\`\`\`bash\ngit remote add upstream https://github.com/IAmParadox27/jellyfin-plugin-custom-tabs.git\ngit fetch upstream main\ngit checkout main\ngit rebase upstream/main\n# fix conflicts\ngit push origin main --force-with-lease\n\`\`\``,
                labels: ['sync-failure'],
              });
            }
